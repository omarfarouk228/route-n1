<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Route N1 · Taxi-brousse de Lomé à Dapaong</title>
  <meta name="description" content="Conduis un taxi-brousse sur la Nationale 1 du Togo, de Lomé à Dapaong. Choisis tes passagers, double les camions, gère l'essence et passe la faille d'Alédjo. Gratuit, dans le navigateur, sur PC et mobile.">
  <meta name="theme-color" content="#0c110e">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Route N1 · Taxi-brousse de Lomé à Dapaong">
  <meta property="og:description" content="618 km de vraie N1 en taxi-brousse, à l'aller et au retour : passagers, marchandage, péages, faille d'Alédjo. Jeu gratuit dans le navigateur.">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://omarfarouk228.github.io/route-n1/">
  <meta property="og:image" content="https://omarfarouk228.github.io/route-n1/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="c" aria-label="Vue du jeu"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="glass stage">
        <div class="tag" id="h-stage">Étape 1/6</div>
        <div class="route" id="h-route">Lomé → Tsévié</div>
        <div class="meta"><b id="h-dist">32</b> km · <span id="h-pax">0/7 passagers</span></div>
      </div>
      <div class="routebar" aria-hidden="true">
        <div class="track"><div class="fill" id="h-fill"></div><div class="dot" id="h-dot"></div></div>
        <div class="cities" id="h-cities"></div>
      </div>
      <div class="glass wallet">
        <div class="money" id="h-money">0 F</div>
        <div class="clock"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="h-clock">06h00</span></div>
      </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div id="banner" aria-live="polite"></div>
    <div id="h-alert" class="h-alert" hidden><i class="h-al-dot"></i><div><b id="h-al-t"></b><span id="h-al-s"></span></div></div>
    <div class="hud-bottom">
      <div class="left-stack">
        <canvas id="minimap" aria-label="Mini-carte"></canvas>
        <div class="glass gauges">
          <div class="g"><svg viewBox="0 0 24 24" aria-label="Essence"><path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h14M7 8h6M15 9h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/></svg><div class="bar"><i id="g-fuel"></i></div><em id="g-fuel-t">30 L</em></div>
          <div class="g"><svg viewBox="0 0 24 24" aria-label="État du taxi"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg><div class="bar"><i id="g-hp"></i></div><em id="g-hp-t">100 %</em></div>
          <div class="g"><svg viewBox="0 0 24 24" aria-label="Confort"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></svg><div class="bar"><i id="g-comfort"></i></div><em id="g-pax">·</em></div>
        </div>
      </div>
      <div class="speedo" aria-label="Vitesse">
        <svg viewBox="0 0 170 170" aria-hidden="true">
          <circle class="sp-bg" cx="85" cy="85" r="80"/>
          <circle class="sp-trk" cx="85" cy="85" r="68"/>
          <circle class="sp-val" id="sp-arc" cx="85" cy="85" r="68"/>
          <g class="sp-ticks" id="sp-ticks"></g>
        </svg>
        <div class="sp-num"><b id="h-speed">0</b><span>km/h</span></div>
        <div class="sp-gear"><span>RAPPORT</span><b id="h-gear">N</b></div>
      </div>
    </div>
    <div class="hud-btns">
      <button id="b-cam" title="Changer de caméra (C)" aria-label="Caméra"><svg viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button id="b-sound" title="Couper le son (M)" aria-label="Son"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
      <button id="b-pause" title="Pause (P / Échap)" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
    </div>
  </div>

  <div id="radio" class="radio" hidden>
    <div class="r-head" id="r-head" role="button" tabindex="0" title="Réduire ou ouvrir la radio">
      <span class="r-freq" id="r-freq">FM</span>
      <div class="r-info"><b id="r-station">Radio éteinte</b><span id="r-track">Touche R pour allumer</span></div>
      <button class="r-play mini" id="r-mini-play" aria-label="Lecture ou pause"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5l11 7-11 7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <svg class="r-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="r-prog" id="r-prog" role="slider" aria-label="Position dans le titre" tabindex="-1"><i id="r-prog-bar"></i></div>
    <div class="r-time" id="r-time"><span id="r-cur">0:00</span><span id="r-dur"></span></div>
    <div class="r-btns">
      <button id="r-prev" title="Station précédente" aria-label="Station précédente"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="r-back" title="Titre précédent" aria-label="Titre précédent"><svg viewBox="0 0 24 24"><path d="M19 5l-9 7 9 7zM6 5v14"/></svg></button>
      <button class="r-play" id="r-play" title="Lecture ou pause" aria-label="Lecture ou pause"><svg viewBox="0 0 24 24"><path class="i-play" d="M8 5l11 7-11 7z"/><path class="i-pause" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button id="r-skip" title="Titre suivant (N)" aria-label="Titre suivant"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM18 5v14"/></svg></button>
      <button id="r-next" title="Station suivante (T)" aria-label="Station suivante"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button id="r-power" title="Allumer ou éteindre (R)" aria-label="Allumer ou éteindre la radio"><svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 7.3a8 8 0 1 0 11.4 0"/></svg></button>
    </div>
    <div class="r-vol"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><input type="range" id="r-vol" min="0" max="1" step="0.05" aria-label="Volume de la radio"></div>
    <div class="r-foot"><span class="r-note" id="r-note"></span><button id="r-hide" title="Masquer la radio, la musique continue (V)">Masquer</button></div>
  </div>
  <button id="radio-pill" class="radio-pill" hidden aria-label="Afficher la radio" title="Afficher la radio (V)">
    <span class="eq"><i></i><i></i><i></i></span><b id="pill-freq">FM</b>
  </button>

  <div id="touch" hidden>
    <div class="t-left">
      <button data-k="left" aria-label="Gauche"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-k="right" aria-label="Droite"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="t-right">
      <button data-k="horn" class="horn">Klaxon</button>
      <button data-k="brake" class="brake">Frein</button>
      <button data-k="gas" class="gas">Gaz</button>
    </div>
  </div>

  <section class="screen" id="s-title"></section>
  <section class="screen" id="s-garage"></section>
  <section class="screen" id="s-gare"></section>
  <section class="screen" id="s-arrival"></section>
  <section class="screen" id="s-end"></section>
  <section class="screen modal" id="s-pause"></section>
  <section class="screen modal" id="s-modal"></section>

  <div id="loading"><div class="ld-logo"><span class="ld-n1">N1</span><span class="ld-word">ROUTE</span></div><div class="ld-bar"><i></i></div><div class="ld-sub">Lomé → Dapaong · on charge le taxi</div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
