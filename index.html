<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Route N1 · Taxi-brousse de Lomé à Dapaong</title>
  <meta name="description" content="Conduis un taxi-brousse sur la Nationale 1 du Togo, de Lomé à Dapaong. Choisis tes passagers, double les camions, gère l'essence et passe la faille d'Alédjo. Gratuit, dans le navigateur, sur PC et mobile.">
  <meta name="theme-color" content="#0f5c3c">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Route N1 · Taxi-brousse de Lomé à Dapaong">
  <meta property="og:description" content="600 km de N1 en taxi-brousse : passagers, camions, contrôles, faille d'Alédjo. Jeu gratuit dans le navigateur.">
  <meta property="og:locale" content="fr_FR">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="c" aria-label="Vue du jeu"></canvas>

  <div id="hud" hidden>
    <div class="hud-top">
      <div class="card stage">
        <div class="eyebrow" id="h-stage">Étape 1/6</div>
        <div class="route" id="h-route">Lomé → Tsévié</div>
        <div class="dist"><b id="h-dist">35</b> km · <span id="h-pax">0/7 passagers</span></div>
      </div>
      <div class="routebar" aria-hidden="true">
        <div class="track"><div class="fill" id="h-fill"></div><div class="dot" id="h-dot"></div></div>
        <div class="cities" id="h-cities"></div>
      </div>
      <div class="card wallet">
        <div class="money" id="h-money">0 F</div>
        <div class="clock" id="h-clock">06h00</div>
      </div>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <div class="hud-bottom">
      <div class="left-stack">
      <canvas id="minimap" aria-label="Mini-carte"></canvas>
      <div class="card gauges">
        <div class="g"><span>Essence</span><div class="bar"><i id="g-fuel"></i></div><em id="g-fuel-t">30 L</em></div>
        <div class="g"><span>Taxi</span><div class="bar"><i id="g-hp"></i></div><em id="g-hp-t">100 %</em></div>
        <div class="g"><span>Confort</span><div class="bar"><i id="g-comfort"></i></div><em id="g-pax">0/7</em></div>
      </div>
      </div>
      <div class="card speed"><b id="h-speed">0</b><span>km/h</span></div>
    </div>
    <div class="hud-btns">
      <button id="b-cam" title="Changer de caméra (C)">Caméra</button>
      <button id="b-sound" title="Couper le son (M)">Son</button>
      <button id="b-pause" title="Pause (P / Échap)">Pause</button>
    </div>
  </div>

  <div id="radio" class="radio" hidden>
    <div class="r-head">
      <span class="r-freq" id="r-freq">FM</span>
      <div class="r-info"><b id="r-station">Radio éteinte</b><span id="r-track">Touche R ou ⏻ pour allumer</span></div>
    </div>
    <div class="r-video" id="r-video" hidden><div id="r-yt"></div></div>
    <div class="r-btns">
      <button id="r-prev" title="Station précédente" aria-label="Station précédente">◀</button>
      <button id="r-power" title="Allumer ou éteindre (R)" aria-label="Allumer ou éteindre la radio">⏻</button>
      <button id="r-next" title="Station suivante (T)" aria-label="Station suivante">▶</button>
      <button id="r-skip" title="Titre suivant (N)" aria-label="Titre suivant">⏭</button>
    </div>
    <div class="r-note" id="r-note"></div>
  </div>

  <div id="touch" hidden>
    <div class="t-left">
      <button data-k="left" aria-label="Gauche">◀</button>
      <button data-k="right" aria-label="Droite">▶</button>
    </div>
    <div class="t-right">
      <button data-k="horn" class="horn">Klaxon</button>
      <button data-k="brake" class="brake">Frein</button>
      <button data-k="gas" class="gas">Gaz</button>
    </div>
  </div>

  <section class="screen" id="s-title"></section>
  <section class="screen" id="s-garage"></section>
  <section class="screen" id="s-gare"></section>
  <section class="screen" id="s-arrival"></section>
  <section class="screen" id="s-end"></section>
  <section class="screen modal" id="s-pause"></section>
  <section class="screen modal" id="s-modal"></section>

  <div id="loading"><div class="ld-title">ROUTE N1</div><div class="ld-sub">On charge le taxi…</div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
